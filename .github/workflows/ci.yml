name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint, typecheck, test, build
        run: pnpm turbo run lint typecheck test build
        env:
          EXPO_NO_TELEMETRY: '1'
          NEXT_TELEMETRY_DISABLED: '1'

  mobile:
    name: Mobile bundles (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [patient, clinic]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Bundles the app's JavaScript for iOS and Android as an EAS build would, without store
      # credentials: catches imports of missing native modules and bundler errors before a build.
      - name: Bundle iOS and Android
        run: pnpm --filter @dhc/mobile bundle
        env:
          APP_VARIANT: ${{ matrix.variant }}
          CI: '1'
          EXPO_NO_TELEMETRY: '1'

  integration:
    name: Integration and tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dhc
          POSTGRES_PASSWORD: dhc
          POSTGRES_DB: dhc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dhc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # For the platform console's queue counts (system health).
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Applies migrations (global setup), then runs the auth and tenant-isolation suites.
      - name: Integration tests
        run: pnpm turbo run test:integration
        env:
          TEST_DATABASE_URL: postgresql://dhc:dhc@localhost:5432/dhc_test
          TEST_REDIS_URL: redis://localhost:6379/15

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dhc
          POSTGRES_PASSWORD: dhc
          POSTGRES_DB: dhc_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dhc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build API and web app
        run: pnpm turbo run build --filter=@dhc/api --filter=@dhc/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Install Chromium
        run: pnpm --filter @dhc/e2e exec playwright install --with-deps chromium

      # Starts the built API and web app, applies migrations, runs the Playwright suite.
      - name: Browser tests
        run: pnpm --filter @dhc/e2e test:e2e
        env:
          E2E_DATABASE_URL: postgresql://dhc:dhc@localhost:5432/dhc_e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7
