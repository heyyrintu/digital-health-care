name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint, typecheck, test, build
        run: pnpm turbo run lint typecheck test build
        env:
          EXPO_NO_TELEMETRY: '1'
          NEXT_TELEMETRY_DISABLED: '1'

  integration:
    name: Integration and tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dhc
          POSTGRES_PASSWORD: dhc
          POSTGRES_DB: dhc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dhc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Applies migrations (global setup), then runs the auth and tenant-isolation suites.
      - name: Integration tests
        run: pnpm turbo run test:integration
        env:
          TEST_DATABASE_URL: postgresql://dhc:dhc@localhost:5432/dhc_test
