# Local development services only. Synthetic data only.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dhc
      POSTGRES_PASSWORD: dhc
      POSTGRES_DB: dhc
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dhc']
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
volumes:
  postgres-data:
